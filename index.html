<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js Project</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: system-ui, sans-serif;
      }
      canvas {
        display: block;
      }
      .simulation-panels {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: #f4f4f4;
        font-family: system-ui, sans-serif;
        font-size: 12px;
      }
      .sim-panel {
        position: fixed;
        top: 16px;
        width: 300px;
        max-height: calc(100vh - 32px);
        overflow: hidden;
        background: rgba(0, 0, 0, 0.62);
        border: 1px solid rgba(255, 255, 255, 0.14);
        pointer-events: auto;
      }
      .runtime-panel {
        left: 16px;
      }
      .physics-panel {
        right: 16px;
      }
      .sim-panel__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 8px 10px;
        border: 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.14);
        background: transparent;
        color: inherit;
        font: inherit;
        font-weight: 600;
        text-align: left;
        cursor: pointer;
      }
      .sim-panel__body {
        max-height: calc(100vh - 74px);
        overflow-y: auto;
        padding: 8px 10px 10px;
      }
      .sim-panel.is-collapsed .sim-panel__body {
        display: none;
      }
      .sim-panel__section {
        margin: 10px 0 5px;
        font-weight: 700;
      }
      .sim-panel__section:first-child {
        margin-top: 0;
      }
      .sim-panel__subsection {
        margin: 8px 0 4px;
        opacity: 0.85;
        font-weight: 600;
      }
      .sim-panel__row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        padding: 2px 0;
      }
      .sim-panel__control {
        display: grid;
        grid-template-columns: 95px 1fr;
        gap: 8px;
        align-items: center;
        padding: 4px 0;
      }
      .sim-panel__control-label {
        opacity: 0.75;
      }
      .sim-panel__control-inputs {
        display: grid;
        grid-template-columns: 1fr 62px 28px;
        gap: 6px;
        align-items: center;
      }
      .sim-panel__control-inputs--number-only {
        grid-template-columns: 1fr 28px;
      }
      .sim-panel__control-inputs--number-only input[type='number'] {
        width: 100%;
      }
      .sim-panel__control input {
        min-width: 0;
        color: #f4f4f4;
        font: inherit;
      }
      .sim-panel__control input[type='range'] {
        width: 100%;
      }
      .sim-panel__control input[type='number'] {
        width: 62px;
        padding: 2px 3px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.08);
      }
      .sim-panel__unit {
        min-width: 24px;
        opacity: 0.6;
      }
      .sim-panel__label {
        opacity: 0.7;
      }
      .sim-panel__value {
        max-width: 150px;
        overflow: hidden;
        text-align: right;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .sim-complete-popup {
        position: fixed;
        left: 50%;
        bottom: 72px;
        transform: translateX(-50%);
        max-width: min(360px, calc(100vw - 32px));
        padding: 7px 10px;
        background: rgba(0, 0, 0, 0.68);
        border: 1px solid rgba(255, 255, 255, 0.16);
        text-align: center;
        pointer-events: none;
      }
      .sim-complete-popup[hidden] {
        display: none;
      }

    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
